services:
  proxypool:
    build: .
    container_name: proxypool
    ports:
      - "8416:8416"
    volumes:
      - proxypool-data:/app/data
    environment:
      - PORT=8416
      - SOCKS_PORT=1080
      - DB_PATH=/app/data/proxypool.db
      - GEOIP_DB_PATH=/app/data/GeoLite2-Country.mmdb
      - JWT_SECRET=change-me-in-production
    restart: unless-stopped

volumes:
  proxypool-data:
